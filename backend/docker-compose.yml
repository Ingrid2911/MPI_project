version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mpi_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: mpi_backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017

  frontend:
    build: ./MPIFrontend/MPIFrontend
    container_name: mpi_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    environment:
      - PythonApi__BaseUrl=http://backend:8000

volumes:
  mongodb_data: